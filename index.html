<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>錯題本</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1d2320;--mu:#6b7570;--ac:#1f7a5c;--acx:#e3f2ec;--bd:#e2e0d9;--rd:#c0392b;--rdx:#fbeae7;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141816;--card:#1e2421;--tx:#e8ece9;--mu:#95a09a;--ac:#4cc39a;--acx:#1c3a2f;--bd:#333b37;--rd:#ef7d6f;--rdx:#3d2320;--on:#0d1a14}}
:root[data-theme="dark"]{--bg:#141816;--card:#1e2421;--tx:#e8ece9;--mu:#95a09a;--ac:#4cc39a;--acx:#1c3a2f;--bd:#333b37;--rd:#ef7d6f;--rdx:#3d2320;--on:#0d1a14}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.6 -apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
#app{max-width:680px;margin:0 auto;padding:16px 16px 100px}
h1{font-size:22px;margin:4px 0 8px}h3{font-size:14px;margin:14px 0 6px;color:var(--mu)}
input,select,textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx)}
input[type=checkbox]{width:auto;margin-right:8px}
label{display:block;font-size:14px;color:var(--mu);margin:14px 0 4px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0;scrollbar-width:none}
.chip{flex:none;padding:6px 12px;border:1px solid var(--bd);border-radius:99px;background:var(--card);color:var(--tx);font:inherit;font-size:14px}
.chip.on{background:var(--ac);border-color:var(--ac);color:var(--on)}
.chip b{margin-left:6px;color:var(--rd);cursor:pointer}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--acx);color:var(--ac)}
.tag.w{background:var(--rdx);color:var(--rd)}
.st{margin-left:auto;font-size:12px;color:var(--mu)}
.pvt{margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.b{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:4px 14px 12px;margin:12px 0}
.b.ok{border-color:var(--ac)}.b.bad{border-color:var(--rd)}
.b h3{margin:10px 0 4px}
.b img{max-width:100%;border-radius:8px;display:block;margin:6px 0}
.tx{overflow-x:auto;word-break:break-word}
.btn{background:var(--ac);color:var(--on);border:0;border-radius:10px;padding:11px 18px;font:inherit}
.ghost{background:transparent;border:1px solid var(--bd);color:var(--tx);border-radius:10px;padding:10px 16px;font:inherit}
.dn{color:var(--rd)}
.back{background:none;border:0;color:var(--ac);font:inherit;padding:0 0 8px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.empty,.mu{color:var(--mu)}
.mtb{display:none;gap:6px;overflow-x:auto;padding:6px 0 0;scrollbar-width:none}.m .mtb{display:flex}
.mtb button{flex:none;padding:5px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font:inherit;font-size:14px}
.pvw{display:none;padding:8px 12px;border:1px dashed var(--bd);border-radius:10px;margin-top:6px;font-size:15px}
.ims{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.th{position:relative}.th img{width:84px;height:84px;object-fit:cover;border-radius:8px;display:block}
.th button{position:absolute;top:2px;right:2px;border:0;border-radius:50%;width:22px;height:22px;background:rgba(0,0,0,.6);color:#fff;line-height:1}
#nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
#nav button{flex:1;background:none;border:0;padding:8px 0;font:inherit;font-size:12px;color:var(--mu)}
#nav button span{display:block;font-size:20px;line-height:1.2}#nav .on{color:var(--ac)}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#222;color:#fff;padding:8px 16px;border-radius:99px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9;max-width:90%;text-align:center}
#toast.s{opacity:1}
mjx-container{max-width:100%;overflow-x:auto;overflow-y:hidden}
.ck{display:flex;gap:10px;align-items:flex-start;margin:0 0 10px;color:var(--tx);font-size:15px}.ck input{margin:5px 0 0;flex:none}
.paper{background:#fff;color:#000;border-radius:12px;padding:14px;border:1px solid var(--bd);overflow-x:auto;font-size:14px;line-height:1.6}
.paper .q{border-collapse:separate;border-spacing:0;width:100%;border:1.5px solid #333;border-radius:14px}
.paper .q td{padding:8px 14px;vertical-align:top;word-break:break-word}
.paper .q tr+tr td{border-top:1.5px solid #333}
.paper .q td.h2:first-child{border-right:1.5px solid #333}
.paper .h2{width:50%;height:44px}.paper .h3{height:56px}.paper .h4{height:44px}
.paper h2{font-size:13px;margin:0 0 4px}.paper h2 small{font-weight:400;color:#666}
.paper .l{margin:2px 0;font-weight:700;color:#1f7a5c}
.paper .q td>img{max-width:100%;display:block;margin:6px 0}
#cr{position:fixed;inset:0;background:#111;z-index:20;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
#crs{flex:1;position:relative;touch-action:none;overflow:hidden}
#cri{position:absolute;user-select:none;-webkit-user-drag:none;pointer-events:none}
#crr{position:absolute;border:2px solid #4cc39a;box-shadow:0 0 0 9999px rgba(0,0,0,.55);touch-action:none;cursor:move}
#crr i{position:absolute;width:28px;height:28px;background:#4cc39a;border-radius:50%;touch-action:none}
#crr i[data-h=nw]{left:-14px;top:-14px}#crr i[data-h=ne]{right:-14px;top:-14px}#crr i[data-h=sw]{left:-14px;bottom:-14px}#crr i[data-h=se]{right:-14px;bottom:-14px}
#crb{justify-content:center;margin:0;padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px))}
.th img{cursor:zoom-in}
.tw{position:relative}.tw textarea{resize:none;display:block;padding-bottom:18px}
.grip{position:absolute;right:3px;bottom:3px;width:16px;height:16px;cursor:ns-resize;touch-action:none;opacity:.75;background:linear-gradient(135deg,transparent 0 48%,var(--mu) 48% 56%,transparent 56% 70%,var(--mu) 70% 78%,transparent 78%)}
.pvw.view{border-style:solid;background:var(--card);padding:10px 12px;cursor:text;margin-top:0}
.pvw.view::after{content:'點一下可編輯原始文字';display:block;color:var(--mu);font-size:12px;margin-top:6px}
.tag.g{background:var(--bd);color:var(--mu)}
</style></head>
<body>
<div id="app"></div><nav id="nav"></nav><div id="toast"></div>
<script>window.MathJax={tex:{inlineMath:[['$','$'],['\\(','\\)']],displayMath:[['$$','$$']]},svg:{fontCache:'local'},startup:{typeset:false}};</script>
<script>
const $=s=>document.querySelector(s);
const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MR=/\$\$[\s\S]+?\$\$|\$[^$\n]+?\$|\\\([\s\S]+?\\\)/g;
const rt=t=>{t=String(t==null?'':t);let o='',last=0,m;MR.lastIndex=0;const f=x=>esc(x).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>');
 while((m=MR.exec(t))){o+=f(t.slice(last,m.index))+esc(m[0]).replace(/\n/g,' ');last=MR.lastIndex}
 return o+f(t.slice(last))};
const fixMath=t=>{let o='',i=0;while(i<t.length){if(t[i]!='$'){o+=t[i++];continue}
 const dbl=t[i+1]=='$',st=i+(dbl?2:1),j=t.indexOf('$',st);
 if(j<0){o+=t.slice(i);break}
 const body=t.slice(st,j),cd=t[j+1]=='$';
 if(!dbl&&body.includes('\n')){o+='$';i++;continue}
 o+=(dbl?'$$':'$')+body+(dbl?'$$':'$');i=j+(cd?2:1)}return o};
const cleanAI=t=>fixMath(t.replace(/```[a-z]*\n?/gi,'').replace(/\\\[([\s\S]+?)\\\]/g,(_,x)=>'$$'+x.trim()+'$$')).replace(/\*\*(.+?)\*\*/g,'$1').replace(/^#{1,6}\s*/gm,'');
const WHY=['觀念不清','計算錯誤','粗心','看錯題','時間不夠','完全不會'];
const FLD=[['q','題目','qi','輸入題目'],['mine','自己選的答案',0,''],['th','當時思路與錯誤原因','ti',''],['ans','正確答案',0,''],['ex','詳解／最佳解','ei','']];
const M=[['行內公式','$$'],['獨立公式','$$$$'],['分數','\\frac{}{}'],['根號','\\sqrt{}'],['次方','^{}'],['下標','_{}'],['≤','\\le '],['≥','\\ge '],['π','\\pi '],['×','\\times '],['∑','\\sum_{}^{}']];
let S={subjects:['國文','英文','數學','物理','化學','生物','地球科學','歷史','地理','公民'],items:[]},V={v:'list',f:'全部',s:'',id:null,tgs:[]},D=null,P=null,LT=null,tm={},ED={},KEEP=0;

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('s');clearTimeout(tm.t);tm.t=setTimeout(()=>t.classList.remove('s'),Math.max(2200,m.length*70))}
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('mistakes',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function load(){try{const d=await idb();const v=await new Promise(r=>{const q=d.transaction('kv').objectStore('kv').get('s');q.onsuccess=()=>r(q.result);q.onerror=()=>r()});if(v)S=v}catch(e){}}
async function save(){try{const d=await idb();await new Promise((r,j)=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(S,'s');t.oncomplete=r;t.onerror=()=>j(t.error)})}catch(e){toast('無法儲存到本機，請先匯出備份')}}
function eqRows(root){root.querySelectorAll('table.eq').forEach(t=>{const q=[...t.querySelectorAll('td.h3,td.h4,td.bz')].map(x=>x.parentNode);q.forEach(r=>r.style.height='');const h=t.rows[0].offsetHeight;q.forEach(r=>r.style.height=h+'px')})}
function eqPaper(){const p=$('.paper');if(p)Promise.all([...p.querySelectorAll('img')].map(i=>i.decode?i.decode().catch(()=>{}):0)).then(()=>eqRows(p))}
function typeset(el){const t=el||$('#app'),p=(window.MathJax&&MathJax.typesetPromise)?MathJax.typesetPromise([t]).catch(()=>{}):Promise.resolve();p.then(eqPaper);return p}
function go(v,o){Object.assign(V,{v},o||{});render();scrollTo(0,0)}

const stat=i=>i.streak>=2?'✓ 已掌握':i.tries?`練習 ${i.tries} 次`:'未練習';
const tags=i=>`<span class=tag>${esc(i.sub)}</span><span class=st>${stat(i)}</span>`;
const blk=(i,k,l,ik)=>(i[k]||(ik&&i[ik].length))?`<section class="b ${k=='ans'?'ok':k=='mine'?'bad':''}"><h3>${l}</h3>${i[k]?`<div class=tx>${rt(i[k])}</div>`:''}${ik?i[ik].map(u=>`<img src="${u}">`).join(''):''}</section>`:'';

function allTags(){const s=new Set();S.items.forEach(i=>(i.tags||[]).forEach(t=>s.add(t)));return[...s].sort()}
const tagLine=i=>(i.tags||[]).length?`<div class=row style="margin:6px 0 0">${i.tags.map(t=>`<span class="tag g">#${esc(t)}</span>`).join('')}</div>`:'';
function tagRow(){const base=S.items.filter(i=>V.f=='全部'||i.sub==V.f),ts=allTags();if(!ts.length)return'';
 return `<div class=chips style="padding-top:0">${ts.map(t=>`<button class="chip ${V.tgs.includes(t)?'on':''}" data-t="${esc(t)}" onclick="togTag(this.dataset.t)">#${esc(t)} ${base.filter(i=>(i.tags||[]).includes(t)).length}</button>`).join('')}</div>`}
function togTag(t){const k=V.tgs.indexOf(t);k<0?V.tgs.push(t):V.tgs.splice(k,1);render()}
function drawTags(){const e=$('#tgb');if(!e)return;const cur=D.tags||[],sug=allTags().filter(t=>!cur.includes(t));
 e.innerHTML=`<div class=chips style="flex-wrap:wrap;padding:4px 0">${cur.map((t,k)=>`<span class="chip on">#${esc(t)}<b data-k="${k}" onclick="D.tags.splice(+this.dataset.k,1);drawTags()" style="color:inherit">✕</b></span>`).join('')}</div>
 <div class=row><input id=ti2 placeholder="輸入標籤，按「加入」或 Enter" style="flex:1" onkeydown="if(event.key=='Enter'){event.preventDefault();addTag()}"><button type=button class=btn onclick="addTag()">加入</button></div>
 ${sug.length?`<div class=chips style="flex-wrap:wrap;padding:6px 0 0">${sug.map(t=>`<button type=button class=chip data-t="${esc(t)}" onclick="addTag(this.dataset.t)">＋ ${esc(t)}</button>`).join('')}</div>`:''}`}
function addTag(t){const inp=$('#ti2'),fromInput=t==null;t=(fromInput?(inp?inp.value:''):t).trim();if(!t)return;D.tags=D.tags||[];if(!D.tags.includes(t))D.tags.push(t);drawTags();if(fromInput){const n=$('#ti2');n&&n.focus()}}
function tagMgr(){const ts=allTags();
 return `<h3>標籤</h3>${ts.length?`<div class=chips style="flex-wrap:wrap">${ts.map(t=>`<span class=chip>#${esc(t)} ${S.items.filter(i=>(i.tags||[]).includes(t)).length}<b data-t="${esc(t)}" onclick="delTag(this.dataset.t)">✕</b></span>`).join('')}</div><p class=mu style="margin:0">按 ✕ 會把這個標籤從所有題目移除（需按兩次確認）。</p>`:'<p class=mu>還沒有標籤。新增題目時可以在最上方加入。</p>'}`}
async function delTag(t){if(V.ct!=t){V.ct=t;toast('再按一次「✕」確認移除「'+t+'」');setTimeout(()=>V.ct=null,3000);return}
 S.items.forEach(i=>{if(i.tags)i.tags=i.tags.filter(x=>x!=t)});V.tgs=V.tgs.filter(x=>x!=t);if(X.tg==t)X.tg='';await save();render()}
function vList(){
 const its=S.items.filter(i=>(V.f=='全部'||i.sub==V.f)&&V.tgs.every(t=>(i.tags||[]).includes(t))&&(!V.s||[i.q,i.mine,i.th,i.ans,i.ex,...(i.tags||[])].join(' ').includes(V.s))).sort((a,b)=>b.created-a.created);
 const cnt=s=>S.items.filter(i=>s=='全部'||i.sub==s).length;
 return `<h1>錯題本</h1><input id=sr placeholder="搜尋題目、詳解…" value="${esc(V.s)}" oninput="V.s=this.value;clearTimeout(tm.s);tm.s=setTimeout(()=>{render();const e=$('#sr');e.focus();e.setSelectionRange(999,999)},300)">
 <div class=chips>${['全部',...S.subjects].map(s=>`<button class="chip ${s==V.f?'on':''}" data-s="${esc(s)}" onclick="V.f=this.dataset.s;render()">${esc(s)} ${cnt(s)}</button>`).join('')}</div>${tagRow()}
 ${its.length?its.map(i=>`<div class=card onclick="go('detail',{id:'${i.id}'})"><div class=row>${tags(i)}</div><div class=pvt>${i.q?esc(i.q.replace(/\$/g,'')):'（圖片題目）'}</div>${tagLine(i)}</div>`).join(''):'<p class=empty>還沒有錯題。點下方「新增」開始記錄吧！</p>'}`}

function pvHTML(i,m){
 const im=a=>(a||[]).map(u=>`<img src="${u}">`).join(''),tx=t=>t?`<div>${rt(t)}</div>`:'',
  cl=(t,x,a,c)=>`<p class=l${c?' style="color:#c0392b"':''}>${t}</p>${tx(x)}${im(a)}`,
  td=(c,k,sp)=>`<td${sp?' colspan=2':''}${k?` class=${k}`:''}>${c}</td>`,one=(c,k)=>`<tr>${td(c,k,1)}</tr>`,
  bl=`<div style="height:${90+(i.c2?(i.n2||3):0)*26}px"></div>`;
 return '<table class="q eq">'+one(`<h2><small>${esc(i.sub)}</small></h2>`+tx(i.q)+im(i.qi))+(m==3?
  `<tr>${td(cl('正確答案',i.ans),'h2')}${td(cl('自己選的答案',i.mine,0,1),'h2')}</tr>`
  +one(`<p class=l style="color:#c0392b">當時思路與錯誤原因</p><div style="min-height:${(i.c1?(i.n1||3):0)*26}px">${tx(i.th)}${im(i.ti)}</div>`,'h4')
  +one(cl('詳解／最佳解',i.ex,i.ei),'h3')+one(`<p class=l>再練一次</p>${bl}`,'bz')
  :one(`<p class=l>作答區</p>${bl}`,'bz'))+'</table>'}
function vDetail(){
 const i=S.items.find(x=>x.id==V.id);if(!i){V.v='list';return vList()}
 return `<button class=back onclick="go('list')">← 返回</button><div class=row>${tags(i)}</div>${tagLine(i)}
 <label>匯出預覽（大小為示意，實際依紙張而定）</label><select onchange="V.pm=this.value;render()"><option value=3 ${V.pm!=1?'selected':''}>完整錯題本</option><option value=1 ${V.pm==1?'selected':''}>練習卷</option></select>
 <div class=paper style="margin-top:10px">${pvHTML(i,V.pm==1?1:3)}</div>
 <div class=acts><button class=btn onclick="startPrac([S.items.find(x=>x.id=='${i.id}')])">再練一次</button><button class=ghost onclick="edit('${i.id}')">編輯</button><button class="ghost dn" onclick="del('${i.id}')">刪除</button></div>`}

async function del(id){if(V.cf!=id){V.cf=id;toast('再按一次「刪除」確認');setTimeout(()=>V.cf=null,3000);return}
 S.items=S.items.filter(x=>x.id!=id);await save();toast('已刪除');go('list')}

function edit(id){const i=id&&S.items.find(x=>x.id==id);ED={};
 D=i?JSON.parse(JSON.stringify(i)):{id:'',sub:V.f!='全部'?V.f:S.subjects[0],why:'',q:'',qi:[],mine:'',th:'',ti:[],ans:'',ex:'',ei:[],tries:0,streak:0,last:0,tags:V.tgs.slice()};D.tags=D.tags||[];go('form')}
const WHYI=()=>`<label>錯誤原因（簡短，例如：公式記錯、粗心看錯）</label><input value="${esc(D.why)}" list=wl oninput="D.why=this.value"><datalist id=wl>${WHY.map(w=>`<option value="${w}">`).join('')}</datalist>`;
const XL=(c,n,t)=>`<label class=ck style="margin:8px 0"><input type=checkbox ${D[c]?'checked':''} onchange="D['${c}']=this.checked"><span>匯出時${t}多給 <input type=number min=1 max=15 value=${D[n]||3} onchange="D['${n}']=Math.max(1,Math.min(15,+this.value||3))" style="width:64px;display:inline-block;padding:4px 8px;margin:0"> 行空白</span></label>`;
function vForm(){
 return `<button class=back onclick="D.id?go('detail',{id:D.id}):go('list')">← 取消</button><h1>${D.id?'編輯':'新增'}錯題</h1>
 <div id=fm class="${D.sub=='數學'?'m':''}">
 <label>標籤（例如：112學年、第一次段考）</label><div id=tgb></div>
 <label>科目</label><select onchange="D.sub=this.value;$('#fm').classList.toggle('m',D.sub=='數學');FLD.forEach(x=>upd(x[0]))">${S.subjects.map(s=>`<option ${s==D.sub?'selected':''}>${esc(s)}</option>`).join('')}</select>
 ${FLD.map(([k,l,ik,ph])=>`<label>${l}</label><div class=tw><textarea id=t_${k} rows=${k=='mine'||k=='ans'?2:4} placeholder="${ph}" oninput="D.${k}=this.value;pv('${k}')" onfocus="ED['${k}']=true" onblur="blurF('${k}')">${esc(D[k])}</textarea><span class=grip data-t="t_${k}" title="拖曳調整高度"></span></div><div class="tx pvw" id=p_${k} onclick="if(this.classList.contains('view')){ED['${k}']=true;upd('${k}');$('#t_${k}').focus()}"></div><div class=mtb>${M.map((m,n)=>`<button type=button onpointerdown="KEEP=Date.now();event.preventDefault()" onclick="ins(M[${n}][1],'${k}')">${m[0]}</button>`).join('')}</div>${ik?`<div class=ims id=i_${ik}></div><button type=button class=ghost onclick="pick('${ik}')">＋ 圖片／拍照</button>`:''}${k=='ex'?AIB():k=='th'?XL('c1','n1','「當時思路與錯誤原因」'):''}`).join('')}
 <label>再練一次</label>${XL('c2','n2','「再練一次」')}
 <div class=acts><button class=btn style="width:100%" onclick="saveItem()">儲存</button></div></div>`}
document.addEventListener('pointerdown',e=>{const gp=e.target.closest&&e.target.closest('.grip');if(!gp)return;
 const t=document.getElementById(gp.dataset.t),y0=e.clientY,h0=t.offsetHeight;KEEP=Date.now();gp.setPointerCapture(e.pointerId);e.preventDefault();

 const fit=()=>{const cw=st.clientWidth,ch=st.clientHeight;sc=Math.min(cw/im.naturalWidth,ch/im.naturalHeight);W=im.naturalWidth*sc;H=im.naturalHeight*sc;ox=(cw-W)/2;oy=(ch-H)/2;

 im.onload=()=>{if(first){first=false;fit()}};im.src=u;
 bx.onpointerdown=e=>{g={h:e.target.dataset.h||'m',x:e.clientX,y:e.clientY,r:{...R}};bx.setPointerCapture(e.pointerId);e.preventDefault()};

function scanify(cv){
 const w=cv.width,h=cv.height,g=cv.getContext('2d'),id=g.getImageData(0,0,w,h),d=id.data,B=32,bw=Math.ceil(w/B),bh=Math.ceil(h/B),bg=new Float32Array(bw*bh),L=new Uint8Array(w*h);
 for(let i=0,j=0;i<d.length;i+=4,j++)L[j]=(d[i]*299+d[i+1]*587+d[i+2]*114)/1000;
 for(let by=0;by<bh;by++)for(let bx=0;bx<bw;bx++){const hist=new Uint16Array(256);let n=0;
  for(let y=by*B;y<Math.min(h,by*B+B);y++)for(let x=bx*B;x<Math.min(w,bx*B+B);x++){hist[L[y*w+x]]++;n++}
  let c=0,v=255;for(let k=255;k>=0;k--){c+=hist[k];if(c>=n*.1){v=k;break}}bg[by*bw+bx]=Math.max(v,1)}
 const cl=(a,lo,hi)=>a<lo?lo:a>hi?hi:a;
 for(let y=0;y<h;y++){const fy=cl((y+.5)/B-.5,0,bh-1),y0=Math.floor(fy),y1=Math.min(bh-1,y0+1),ty=fy-y0;
  for(let x=0;x<w;x++){const fx=cl((x+.5)/B-.5,0,bw-1),x0=Math.floor(fx),x1=Math.min(bw-1,x0+1),tx=fx-x0;
   const b=(bg[y0*bw+x0]*(1-tx)+bg[y0*bw+x1]*tx)*(1-ty)+(bg[y1*bw+x0]*(1-tx)+bg[y1*bw+x1]*tx)*ty;
   const v=L[y*w+x]/b<.8?0:255,o=(y*w+x)*4;d[o]=d[o+1]=d[o+2]=v}}
 g.putImageData(id,0,0)}
const shrink=f=>new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{const k=Math.min(1,1000/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.72))};im.src=r.result};r.readAsDataURL(f)});
