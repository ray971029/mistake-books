async function aiAsk(prompt,imgs){
 const c=aiCfg();if(!c.k)throw new Error('請先到「設定」輸入 API key');
 const p=c.p||'anthropic',m=c.m||AIM[p],im=(imgs||[]).map(u=>({mt:u.slice(5,u.indexOf(';')),d:u.split(',')[1],u}));
 let url,h={'content-type':'application/json'},body,get;
 if(p=='anthropic'){url='https://api.anthropic.com/v1/messages';h['x-api-key']=c.k;h['anthropic-version']='2023-06-01';h['anthropic-dangerous-direct-browser-access']='true';
  body={model:m,max_tokens:2000,messages:[{role:'user',content:[...im.map(x=>({type:'image',source:{type:'base64',media_type:x.mt,data:x.d}})),{type:'text',text:prompt}]}]};get=j=>j.content.map(x=>x.text||'').join('')}
 else if(p=='openai'){url='https://api.openai.com/v1/chat/completions';h.authorization='Bearer '+c.k;
  body={model:m,messages:[{role:'user',content:[{type:'text',text:prompt},...im.map(x=>({type:'image_url',image_url:{url:x.u}}))]}]};get=j=>j.choices[0].message.content}
 else{url='https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(m)+':generateContent';h['x-goog-api-key']=c.k;
  body={contents:[{parts:[{text:prompt},...im.map(x=>({inline_data:{mime_type:x.mt,data:x.d}}))]}]};get=j=>j.candidates[0].content.parts.map(x=>x.text||'').join('')}
 let r;try{r=await fetch(url,{method:'POST',headers:h,body:JSON.stringify(body)})}catch(e){throw new Error('無法連線到 AI 服務。若是在 claude.ai 上開啟，瀏覽器會擋掉外部連線，請改用下載的檔案開啟。')}
 const j=await r.json().catch(()=>({}));
 if(!r.ok){const e=j.error;throw new Error(((e&&(e.message||(typeof e=='string'?e:JSON.stringify(e))))||('HTTP '+r.status))+(r.status==404?'（模型名稱可能不對，請到設定按「查詢可用模型」）':''))}
 return get(j)}
const AIB=()=>`<div class=row style="margin-top:8px"><button type=button id=aib class=ghost onclick="aiSolve()">🤖 AI 解題</button><span id=ais class=mu></span></div>`;
async function aiSolve(){
 if(!D.q.trim()&&!D.qi.length)return toast('請先輸入題目或加入圖片');
 const b=$('#aib'),st=$('#ais');b.disabled=true;st.textContent='解題中…';
 const pr=`請用繁體中文解答下面這題（科目：${D.sub}）。請自行從題目內容判斷它的年級、考試類型與出處，用符合該程度的方式解釋。\n\n輸出格式（嚴格遵守；不要前言、不要結語、不要重複題目，越精簡越好）：\n第一行：「正確答案：…」（多選題寫成 (A)(C)(D) 這種形式）\n空一行後寫「詳解：」，接著依題型：\n．選擇題（單選或多選）：每個選項一行，寫成「(A) ○：原因」或「(A) ×：原因」，依 A、B、C… 順序逐項說明，每項原因一到兩句。\n．填充、計算或問答題：用 1. 2. 3. 分步驟，每步只寫關鍵算式與一句說明。\n\n不要使用 Markdown 符號（不要 **粗體**、# 標題、程式碼區塊）。數學、物理、化學的式子與符號一律用 LaTeX：行內用 $…$，獨立一行用 $$…$$，開頭與結尾的符號數量必須一致且成對，中文標點不要放進公式裡；化學式寫成 $\\mathrm{H_2O}$ 這種形式，不要使用 \\ce 或 \\require。\n\n題目：\n${D.q||'（見圖片）'}`+(D.ans.trim()?`\n\n已知的正確答案：${D.ans.trim()}\n請以這個答案為準來寫詳解；若你自己的推導與它不同，請在詳解最後加一行「注意：我的推導與已知答案不同，原因：…」。`:'')+(D.mine?`\n\n學生選的答案：${D.mine}`:'')+(D.th?`\n學生當時的思路：${D.th}`:'')+(D.mine||D.th?'\n\n最後另起一行寫「錯因：」，用一句話指出學生可能錯在哪裡。':'');
 try{const t=cleanAI(await aiAsk(pr,[...D.qi,...D.ti]));
  const m=t.match(/^\s*正確答案[:：]\s*(.+)/);
  if(m&&!D.ans.trim()){D.ans=m[1].trim();$('#t_ans').value=D.ans;ED.ans=false;upd('ans')}
  const body=t.replace(/^\s*正確答案[:：].*\n+/,'').replace(/^\s*詳解[:：]\s*/,'');
  D.ex=(D.ex.trim()?D.ex.trim()+'\n\n':'')+'【AI 解題】\n'+body.trim();
  {const t=$('#t_ex');t.value=D.ex;t.style.height=Math.min(420,Math.max(t.offsetHeight,t.scrollHeight+4))+'px'}ED.ex=false;upd('ex');st.textContent='完成（AI 可能出錯，請自行核對）'}
 catch(e){st.textContent='失敗：'+e.message}
 b.disabled=false}
